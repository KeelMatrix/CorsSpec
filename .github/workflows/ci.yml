name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run repository validation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Validate.ps1 -Mode Full -Version 0.1.0

      - name: Upload validated package artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ matrix.name }}
          path: ./artifacts/packages
          if-no-files-found: error
